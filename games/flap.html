<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flap — EverCharge Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="wrap">
  <div class="bar">
    <a class="back" href="../index.html">← All games</a>
    <div class="title">Flap</div>
    <div class="stats">
      <div class="stat"><small>Score</small><b id="score">0</b></div>
      <div class="stat"><small>Best</small><b id="best">0</b></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="touch">
    <button class="wide" data-key=" ">Flap</button>
  </div>
  <p class="hint">Tap to flap. Thread the gaps — they tighten slowly as you go.</p>
</main>

<script src="../arcade.js"></script>
<script>
(function () {
  "use strict";
  var A = window.Arcade;
  var W = 560, H = 560;
  var ctx = A.fit(document.getElementById("c"), W, H);
  var k = A.keys();
  var ov = A.overlay(document.getElementById("ov"));
  var scoreEl = document.getElementById("score"), bestEl = document.getElementById("best");
  var stage = document.querySelector(".stage");
  A.touchKeys(document.querySelector(".touch"), k);

  var GRAV = 1500, FLAP = -420, PIPE_W = 68, GROUND = 72;
  var bird, pipes, score, alive, running, spawn, scroll, bgx;

  function reset() {
    bird = { x: 150, y: H / 2, v: 0, rot: 0 };
    pipes = [];
    score = 0; alive = true; spawn = 0; scroll = 170; bgx = 0;
    scoreEl.textContent = "0";
    bestEl.textContent = A.best("flap");
  }

  function gapFor(s) {
    // generous at first, tightening to a floor that is still comfortably flyable
    return Math.max(132, 196 - s * 2.2);
  }

  function addPipe() {
    var gap = gapFor(score);
    var margin = 60;
    var top = A.rnd(margin, H - GROUND - margin - gap);
    pipes.push({ x: W + PIPE_W, top: top, gap: gap, passed: false });
  }

  function flap() {
    if (!running) return;
    if (!alive) return;
    bird.v = FLAP;
  }

  function die() {
    alive = false;
    var b = A.best("flap", score);
    bestEl.textContent = b;
    ov.show("<h2>Down you go</h2><p>You passed <b>" + score + "</b> pipe" + (score === 1 ? "" : "s") +
      (score >= b && score > 0 ? " — a new best!" : "") + "</p>" +
      '<button class="btn go" data-act="again">Try again</button>' +
      '<a class="btn" href="../index.html">All games</a>');
  }

  function update(dt) {
    if (!alive) return;

    if (k.tapped(" ") || k.tapped("ArrowUp") || k.tapped("w") || k.tapped("W")) flap();

    bird.v += GRAV * dt;
    bird.y += bird.v * dt;
    bird.rot = A.clamp(bird.v / 700, -0.5, 1.2);

    scroll = 170 + Math.min(score * 2.4, 70);
    bgx -= scroll * dt * 0.35;

    spawn -= dt;
    if (spawn <= 0) {
      addPipe();
      spawn = Math.max(1.12, 1.6 - score * 0.012);
    }

    for (var i = pipes.length - 1; i >= 0; i--) {
      var p = pipes[i];
      p.x -= scroll * dt;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        scoreEl.textContent = score;
      }
      if (p.x + PIPE_W < -10) pipes.splice(i, 1);
    }

    // collisions — circle vs the two pipe rectangles
    var r = 15;
    if (bird.y + r > H - GROUND) { bird.y = H - GROUND - r; return die(); }
    if (bird.y - r < 0) { bird.y = r; bird.v = 0; }

    for (var j = 0; j < pipes.length; j++) {
      var q = pipes[j];
      if (bird.x + r < q.x || bird.x - r > q.x + PIPE_W) continue;
      if (bird.y - r < q.top || bird.y + r > q.top + q.gap) return die();
    }
  }

  function drawPipe(p) {
    var g = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    g.addColorStop(0, "#3FA76F");
    g.addColorStop(0.5, "#4CC98A");
    g.addColorStop(1, "#2F8558");
    ctx.fillStyle = g;
    A.rrect(ctx, p.x, 0, PIPE_W, p.top, 7); ctx.fill();
    A.rrect(ctx, p.x - 6, p.top - 20, PIPE_W + 12, 20, 6); ctx.fill();
    var by = p.top + p.gap;
    A.rrect(ctx, p.x, by, PIPE_W, H - GROUND - by, 7); ctx.fill();
    A.rrect(ctx, p.x - 6, by, PIPE_W + 12, 20, 6); ctx.fill();
  }

  function draw() {
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#1C2740");
    sky.addColorStop(1, "#2A3A5C");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // parallax hills
    ctx.fillStyle = "rgba(255,255,255,.045)";
    for (var i = -1; i < 5; i++) {
      var hx = ((bgx % 200) + 200) % 200 + i * 200;
      ctx.beginPath();
      ctx.arc(hx, H - GROUND + 10, 86, Math.PI, 0);
      ctx.fill();
    }

    pipes.forEach(drawPipe);

    ctx.fillStyle = "#2B2F42";
    ctx.fillRect(0, H - GROUND, W, GROUND);
    ctx.fillStyle = "#4CC98A";
    ctx.fillRect(0, H - GROUND, W, 5);

    // bird
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.fillStyle = "#F2D06B";
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#F5A15B";
    ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(23, 4); ctx.lineTo(11, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#12141F";
    ctx.beginPath(); ctx.arc(6, -5, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.ellipse(-3, 2, 8, 5.5, bird.v / 2200, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (running && alive) {
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.font = "800 44px 'Bricolage Grotesque', ui-sans-serif, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(score, W / 2, 64);
    }
  }

  ov.onClick("[data-act]", function () {
    reset();
    running = true;
    ov.hide();
    flap();
  });

  stage.addEventListener("pointerdown", function (e) { e.preventDefault(); flap(); });

  reset();
  running = false;
  ov.show("<h2>Flap</h2><p>Keep the bird in the air and slip through the gaps.</p>" +
    '<button class="btn go" data-act="start">Start</button>' +
    '<div class="keys"><kbd>Space</kbd> or click to flap</div>');

  A.loop(function (dt) {
    if (running) update(dt);
    draw();
  });
})();
</script>
</body>
</html>
