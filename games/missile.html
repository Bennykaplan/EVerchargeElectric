<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missile — EverCharge Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="wrap">
  <div class="bar">
    <a class="back" href="../index.html">← All games</a>
    <div class="title">Missile <span id="modeTag" class="tag-inline"></span></div>
    <div class="stats">
      <div class="stat"><small id="scoreLabel">Score</small><b id="score">0</b></div>
      <div class="stat" id="waveWrap"><small>Wave</small><b id="wave">1</b></div>
      <div class="stat"><small>Cities</small><b id="cities">6</b></div>
      <div class="stat" id="skillWrap" hidden><small>Defender</small><b id="skill">1</b></div>
      <div class="stat"><small id="bestLabel">Best</small><b id="best">0</b></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="ov"></div>
  </div>
  <p class="hint" id="hint">Click anywhere to fire an interceptor. It explodes where you clicked — the blast takes out any missile it touches.</p>
</main>

<script src="../arcade.js"></script>
<script>
(function () {
  "use strict";
  var A = window.Arcade;
  var W = 800, H = 540;
  var GROUND = H - 48;
  var canvas = document.getElementById("c");
  var ctx = A.fit(canvas, W, H);
  var ov = A.overlay(document.getElementById("ov"));
  var el = {
    score: document.getElementById("score"), wave: document.getElementById("wave"),
    cities: document.getElementById("cities"), best: document.getElementById("best"),
    scoreLabel: document.getElementById("scoreLabel"), bestLabel: document.getElementById("bestLabel"),
    waveWrap: document.getElementById("waveWrap"), skill: document.getElementById("skill"),
    skillWrap: document.getElementById("skillWrap"), modeTag: document.getElementById("modeTag"),
    hint: document.getElementById("hint")
  };

  var BASE = { x: W / 2, y: GROUND };
  var FRIENDLY_SPEED = 460;
  var ATTACK_BUDGET = 22;      // how many missiles you get in flipped mode
  var ATTACK_COOLDOWN = 0.5;

  var mode = "play";
  var cities, enemies, friendly, blasts, score, wave, running, ammo, spawnLeft, spawnTimer, betweenWaves;
  var sent, attackCool, aiCool;

  function newGame() {
    score = 0; wave = 1;
    sent = 0; attackCool = 0; aiCool = 0;
    cities = [];
    [90, 170, 250, 550, 630, 710].forEach(function (x) { cities.push({ x: x, alive: true }); });
    startWave();
    syncLabels();
    sync();
  }

  function startWave() {
    enemies = []; friendly = []; blasts = [];
    ammo = 12 + Math.min(wave, 6);
    spawnLeft = mode === "flip" ? 0 : 5 + wave * 2;
    spawnTimer = 0.6;
    betweenWaves = false;
  }

  function syncLabels() {
    var flip = mode === "flip";
    el.modeTag.textContent = flip ? "· you attack, the computer defends" : "";
    el.scoreLabel.textContent = flip ? "Missiles fired" : "Score";
    el.bestLabel.textContent = flip ? "Best (fewest)" : "Best";
    el.waveWrap.hidden = flip;
    el.skillWrap.hidden = !flip;
    el.hint.textContent = flip
      ? "Click a city to send a missile at it. The computer intercepts — flatten all six before you run out."
      : "Click anywhere to fire an interceptor. It explodes where you clicked — the blast takes out any missile it touches.";
  }

  function sync() {
    el.score.textContent = mode === "flip" ? (ATTACK_BUDGET - sent) : score;
    el.scoreLabel.textContent = mode === "flip" ? "Missiles left" : "Score";
    el.wave.textContent = wave;
    el.cities.textContent = cities.filter(function (c) { return c.alive; }).length;
    el.skill.textContent = skillTier() + 1;
    el.best.textContent = A.best(mode === "flip" ? "missile-flip" : "missile");
  }

  // ------------------------------------------------------- the defender AI
  function skillTier() {
    if (sent < 6) return 0;
    if (sent < 13) return 1;
    return 2;
  }
  function aiReact() { return [0.42, 0.26, 0.15][skillTier()]; }   // seconds between launches
  function aiAimErr() { return [46, 24, 10][skillTier()]; }        // px of aim scatter
  function aiLead()   { return [0.55, 0.8, 1.0][skillTier()]; }    // how well it leads the target

  function aiDefend(dt) {
    aiCool -= dt;
    if (aiCool > 0) return;

    // the missile closest to landing that nothing is already flying at
    var target = null, lowest = -1;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.covered) continue;
      if (e.y > lowest) { lowest = e.y; target = e; }
    }
    if (!target) return;
    aiCool = aiReact();

    // where will it be when an interceptor could get there?
    var px = target.x, py = target.y;
    for (var k = 0; k < 3; k++) {
      var t = A.dist(BASE.x, BASE.y, px, py) / FRIENDLY_SPEED;
      px = target.x + target.vx * t * aiLead();
      py = target.y + target.vy * t * aiLead();
    }
    px += A.rnd(-aiAimErr(), aiAimErr());
    py += A.rnd(-aiAimErr(), aiAimErr());
    py = A.clamp(py, 40, GROUND - 20);

    target.covered = true;
    launchInterceptor(px, py);
  }

  function launchInterceptor(mx, my) {
    var dx = mx - BASE.x, dy = my - BASE.y;
    var len = Math.hypot(dx, dy) || 1;
    friendly.push({
      x: BASE.x, y: BASE.y, sx: BASE.x, sy: BASE.y, tx: mx, ty: my,
      vx: dx / len * FRIENDLY_SPEED, vy: dy / len * FRIENDLY_SPEED
    });
  }

  // ------------------------------------------------------------- attacking
  function spawnEnemy(tx) {
    var live = cities.filter(function (c) { return c.alive; });
    if (tx === undefined) {
      var targets = live.length ? live.map(function (c) { return c.x; }) : [BASE.x];
      tx = targets[A.rndInt(0, targets.length - 1)] + A.rnd(-18, 18);
    }
    var sx = mode === "flip" ? A.clamp(tx + A.rnd(-160, 160), 20, W - 20) : A.rnd(20, W - 20);
    var sp = mode === "flip" ? 96 + Math.min(sent * 2, 30) : Math.min(44 + wave * 7, 120);
    var dx = tx - sx, dy = GROUND;
    var len = Math.hypot(dx, dy);
    enemies.push({ x: sx, y: 0, sx: sx, sy: 0, tx: tx, vx: dx / len * sp, vy: dy / len * sp, covered: false });
  }

  function playerAttack(mx) {
    if (!running || sent >= ATTACK_BUDGET || attackCool > 0) return;
    attackCool = ATTACK_COOLDOWN;
    sent++;
    spawnEnemy(A.clamp(mx, 20, W - 20));
    sync();
  }

  function fireAt(mx, my) {
    if (!running || betweenWaves || ammo <= 0) return;
    if (my > GROUND - 6) my = GROUND - 6;
    ammo--;
    launchInterceptor(mx, my);
  }

  function boom(x, y, big) {
    blasts.push({ x: x, y: y, r: 0, max: big ? 58 : 34, grow: 150, state: 1 });
  }

  function update(dt) {
    var i, j;
    attackCool -= dt;

    if (mode === "flip") {
      aiDefend(dt);
    } else if (!betweenWaves) {
      spawnTimer -= dt;
      if (spawnTimer <= 0 && spawnLeft > 0) {
        spawnEnemy(); spawnLeft--;
        spawnTimer = Math.max(0.35, 1.5 - wave * 0.07);
      }
    }

    for (i = friendly.length - 1; i >= 0; i--) {
      var f = friendly[i];
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (A.dist(f.x, f.y, f.sx, f.sy) >= A.dist(f.tx, f.ty, f.sx, f.sy)) {
        boom(f.tx, f.ty, true);
        friendly.splice(i, 1);
      }
    }

    for (i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.y >= GROUND) {
        boom(e.x, GROUND, false);
        enemies.splice(i, 1);
        var best = null, bd = 1e9;
        cities.forEach(function (c) {
          if (!c.alive) return;
          var d = Math.abs(c.x - e.x);
          if (d < bd) { bd = d; best = c; }
        });
        if (best && bd < 44) {
          best.alive = false;
          sync();
          if (mode === "flip" && cities.every(function (c) { return !c.alive; })) return attackerWins();
        }
        continue;
      }
      for (j = 0; j < blasts.length; j++) {
        var bl = blasts[j];
        if (A.dist(e.x, e.y, bl.x, bl.y) < bl.r) {
          boom(e.x, e.y, false);
          enemies.splice(i, 1);
          if (mode === "play") { score += 25 * wave; sync(); }
          break;
        }
      }
    }

    for (i = blasts.length - 1; i >= 0; i--) {
      var b = blasts[i];
      if (b.state === 1) { b.r += b.grow * dt; if (b.r >= b.max) b.state = -1; }
      else { b.r -= b.grow * 0.8 * dt; if (b.r <= 0) blasts.splice(i, 1); }
    }

    if (mode === "flip") {
      if (sent >= ATTACK_BUDGET && enemies.length === 0 && friendly.length === 0 && blasts.length === 0) {
        if (cities.some(function (c) { return c.alive; })) return defenderWins();
      }
      return;
    }

    if (!betweenWaves && spawnLeft === 0 && enemies.length === 0 && friendly.length === 0 && blasts.length === 0) {
      betweenWaves = true;
      var alive = cities.filter(function (c) { return c.alive; }).length;
      if (alive === 0) return gameOver();
      score += alive * 50 + ammo * 10;
      sync();
      running = false;
      ov.show("<h2>Wave " + wave + " cleared</h2><p>+" + (alive * 50) + " for surviving cities, +" +
        (ammo * 10) + " for unused missiles.</p>" +
        '<button class="btn go" data-act="next">Next wave</button>');
    }
  }

  function gameOver() {
    running = false;
    var b = A.best("missile", score);
    el.best.textContent = b;
    ov.show("<h2>All cities lost</h2><p>Final score <b>" + score + "</b>" +
      (score >= b && score > 0 ? " — a new best!" : "") + "</p>" +
      '<button class="btn go" data-act="start-play">Play again</button>' +
      '<button class="btn" data-act="start-flip">Attack instead</button>');
  }

  function attackerWins() {
    running = false;
    var prev = 0;
    try { prev = parseInt(localStorage.getItem("evercharge:missile-flip-raw") || "0", 10) || 0; } catch (e) {}
    var fewest = prev === 0 ? sent : Math.min(prev, sent);
    try { localStorage.setItem("evercharge:missile-flip-raw", String(fewest)); } catch (e) {}
    el.best.textContent = fewest;
    ov.show("<h2>All six flattened</h2><p>You got through with <b>" + sent + "</b> missile" +
      (sent === 1 ? "" : "s") + ", against a defender at skill " + (skillTier() + 1) + " of 3.</p>" +
      '<button class="btn go" data-act="start-flip">Go again</button>' +
      '<button class="btn" data-act="start-play">Defend instead</button>');
  }

  function defenderWins() {
    running = false;
    var left = cities.filter(function (c) { return c.alive; }).length;
    ov.show("<h2>The defender held</h2><p>You ran out of missiles with <b>" + left +
      "</b> cit" + (left === 1 ? "y" : "ies") + " still standing. Send them in quick succession — " +
      "it can only track one at a time.</p>" +
      '<button class="btn go" data-act="start-flip">Go again</button>' +
      '<button class="btn" data-act="start-play">Defend instead</button>');
  }

  function draw() {
    var sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, "#0E1120"); sky.addColorStop(1, "#1E2742");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(255,138,125,.55)";
    ctx.lineWidth = 1.6;
    enemies.forEach(function (e) {
      ctx.beginPath(); ctx.moveTo(e.sx, e.sy); ctx.lineTo(e.x, e.y); ctx.stroke();
      ctx.fillStyle = "#FF8A7D";
      ctx.beginPath(); ctx.arc(e.x, e.y, 3, 0, Math.PI * 2); ctx.fill();
    });

    ctx.strokeStyle = "rgba(91,200,232,.75)";
    friendly.forEach(function (f) {
      ctx.beginPath(); ctx.moveTo(f.sx, f.sy); ctx.lineTo(f.x, f.y); ctx.stroke();
      ctx.fillStyle = "#5BC8E8";
      ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill();
    });

    blasts.forEach(function (b) {
      var g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, Math.max(b.r, 1));
      g.addColorStop(0, "rgba(255,255,255,.95)");
      g.addColorStop(0.55, "rgba(245,161,91,.8)");
      g.addColorStop(1, "rgba(255,107,107,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(b.r, 0), 0, Math.PI * 2); ctx.fill();
    });

    ctx.fillStyle = "#2B2F42"; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = "#3C4360"; ctx.fillRect(0, GROUND, W, 4);

    cities.forEach(function (c) {
      if (c.alive) {
        ctx.fillStyle = "#4CC98A";
        A.rrect(ctx, c.x - 20, GROUND - 22, 40, 22, 4); ctx.fill();
        ctx.fillStyle = "#12141F";
        for (var i = 0; i < 3; i++) ctx.fillRect(c.x - 13 + i * 10, GROUND - 16, 5, 7);
      } else {
        ctx.fillStyle = "#3C4360";
        A.rrect(ctx, c.x - 18, GROUND - 7, 36, 7, 3); ctx.fill();
      }
    });

    ctx.fillStyle = "#ECEEF5";
    ctx.beginPath();
    ctx.moveTo(BASE.x - 22, GROUND); ctx.lineTo(BASE.x, GROUND - 26); ctx.lineTo(BASE.x + 22, GROUND);
    ctx.closePath(); ctx.fill();

    ctx.font = "700 14px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    if (mode === "play") {
      ctx.fillStyle = ammo > 3 ? "rgba(255,255,255,.85)" : "#FF8A7D";
      ctx.fillText("MISSILES " + ammo, BASE.x, GROUND - 34);
    } else {
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillText("DEFENDER", BASE.x, GROUND - 34);
      ctx.fillStyle = attackCool > 0 ? "rgba(255,255,255,.25)" : "rgba(255,255,255,.65)";
      ctx.fillText(attackCool > 0 ? "reloading…" : "click a city to strike it", W / 2, 24);
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var r = canvas.getBoundingClientRect();
    var cx = (e.clientX - r.left) * (W / r.width);
    var cy = (e.clientY - r.top) * (H / r.height);
    if (mode === "flip") playerAttack(cx); else fireAt(cx, cy);
  });

  function menu() {
    running = false;
    ov.show("<h2>Missile</h2><p>Pick a side.</p>" +
      '<button class="btn go" data-act="start-play">You defend</button>' +
      '<button class="btn" data-act="start-flip">You attack</button>' +
      '<div class="keys"><b>You defend:</b> click to detonate interceptors in front of incoming missiles.<br>' +
      '<b>You attack:</b> the computer defends. Click a city to launch at it — you get ' + ATTACK_BUDGET +
      ' missiles to flatten all six. The defender only tracks one missile at a time, and gets faster as you go.</div>');
  }

  ov.onClick("[data-act]", function (b) {
    var act = b.getAttribute("data-act");
    if (act === "next") { wave++; startWave(); sync(); running = true; ov.hide(); return; }
    mode = act === "start-flip" ? "flip" : "play";
    newGame();
    running = true;
    ov.hide();
  });

  window.__mis = function () { return { mode: mode, cities: cities, enemies: enemies, friendly: friendly, sent: sent, ammo: ammo }; };

  mode = "play";
  newGame();
  menu();

  A.loop(function (dt) {
    if (running) update(dt);
    draw();
  });
})();
</script>
</body>
</html>
