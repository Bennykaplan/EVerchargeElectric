<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake — EverCharge Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="wrap">
  <div class="bar">
    <a class="back" href="../index.html">← All games</a>
    <div class="title">Snake <span id="modeTag" class="tag-inline"></span></div>
    <div class="stats">
      <div class="stat"><small id="scoreLabel">Score</small><b id="score">0</b></div>
      <div class="stat"><small id="bestLabel">Best</small><b id="best">0</b></div>
      <div class="stat" id="skillWrap" hidden><small>Snake skill</small><b id="skill">1</b></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="touch" id="touch">
    <button data-key="ArrowLeft">←</button>
    <button data-key="ArrowUp">↑</button>
    <button data-key="ArrowDown">↓</button>
    <button data-key="ArrowRight">→</button>
  </div>
  <p class="hint" id="hint">Eat the apples. Don't hit the walls or yourself.</p>
</main>

<script src="../arcade.js"></script>
<script>
(function () {
  "use strict";
  var A = window.Arcade;
  var COLS = 24, ROWS = 18, CELL = 26;
  var canvas = document.getElementById("c");
  var ctx = A.fit(canvas, COLS * CELL, ROWS * CELL);
  var k = A.keys();
  var ov = A.overlay(document.getElementById("ov"));
  var el = {
    score: document.getElementById("score"), best: document.getElementById("best"),
    scoreLabel: document.getElementById("scoreLabel"), bestLabel: document.getElementById("bestLabel"),
    skill: document.getElementById("skill"), skillWrap: document.getElementById("skillWrap"),
    modeTag: document.getElementById("modeTag"), hint: document.getElementById("hint"),
    touch: document.getElementById("touch")
  };
  A.touchKeys(el.touch, k);

  var mode = "play";          // "play" = you steer · "flip" = you place apples, computer steers
  var SURVIVE_TO_WIN = 25;    // in flipped mode, the snake wins if it eats this many
  var snake, dir, nextDir, apple, score, alive, stepTime, acc, started, hover, eaten;

  // ---------------------------------------------------------------- helpers
  function key(x, y) { return y * COLS + x; }
  function onSnake(x, y, skipTail) {
    var n = snake.length - (skipTail ? 1 : 0);
    for (var i = 0; i < n; i++) if (snake[i].x === x && snake[i].y === y) return true;
    return false;
  }
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }
  var DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];

  // ------------------------------------------------- the computer's snake AI
  // Skill climbs as it eats, so early on it is easy to trap and later it is not.
  function skillTier() {
    if (eaten < 3) return 0;      // greedy, only dodges instant death
    if (eaten < 7) return 1;      // shortest path to the apple
    return 2;                     // shortest path, but never into a dead end
  }

  // Breadth-first search over free cells. Returns a map of cell -> previous cell.
  function bfs(startX, startY, body) {
    var blocked = Object.create(null);
    for (var i = 0; i < body.length; i++) blocked[key(body[i].x, body[i].y)] = true;
    var prev = Object.create(null);
    var seen = Object.create(null);
    var q = [{ x: startX, y: startY }];
    seen[key(startX, startY)] = true;
    while (q.length) {
      var cur = q.shift();
      for (var d = 0; d < 4; d++) {
        var nx = cur.x + DIRS[d].x, ny = cur.y + DIRS[d].y, kk = key(nx, ny);
        if (!inBounds(nx, ny) || seen[kk] || blocked[kk]) continue;
        seen[kk] = true;
        prev[kk] = cur;
        q.push({ x: nx, y: ny });
      }
    }
    return { prev: prev, seen: seen };
  }

  // How many cells can the snake still reach from here? Used to avoid dead ends.
  function reachable(fromX, fromY, body) {
    var r = bfs(fromX, fromY, body);
    return Object.keys(r.seen).length;
  }

  // Simulate the body after moving to (nx, ny), so lookahead uses real state.
  function bodyAfterMove(nx, ny, grows) {
    var b = snake.map(function (s) { return { x: s.x, y: s.y }; });
    b.unshift({ x: nx, y: ny });
    if (!grows) b.pop();
    return b;
  }

  function aiChooseDir() {
    if (!apple) return null;
    var head = snake[0];
    var tier = skillTier();

    // every move that is not instantly fatal
    var legal = DIRS.filter(function (d) {
      var nx = head.x + d.x, ny = head.y + d.y;
      if (!inBounds(nx, ny)) return false;
      if (d.x === -dir.x && d.y === -dir.y && snake.length > 1) return false;
      return !onSnake(nx, ny, true);     // the tail cell frees up as it moves
    });
    if (!legal.length) return null;

    if (tier === 0) {
      // plain greedy: close the gap, no planning at all
      legal.sort(function (a, b) {
        var da = Math.abs(head.x + a.x - apple.x) + Math.abs(head.y + a.y - apple.y);
        var db = Math.abs(head.x + b.x - apple.x) + Math.abs(head.y + b.y - apple.y);
        return da - db;
      });
      return legal[0];
    }

    // tiers 1 and 2: shortest path to the apple
    var body = snake.slice(0, snake.length - 1);     // tail will have moved
    var r = bfs(apple.x, apple.y, body);
    var best = null, bestLen = Infinity;
    for (var i = 0; i < legal.length; i++) {
      var d = legal[i], nx = head.x + d.x, ny = head.y + d.y;
      if (nx === apple.x && ny === apple.y) { best = d; bestLen = 0; break; }
      if (!r.seen[key(nx, ny)]) continue;            // apple unreachable from there
      // walk back along the search tree to measure the path
      var steps = 0, cur = { x: nx, y: ny };
      while (cur && !(cur.x === apple.x && cur.y === apple.y) && steps < COLS * ROWS) {
        cur = r.prev[key(cur.x, cur.y)];
        steps++;
      }
      if (steps < bestLen) { bestLen = steps; best = d; }
    }

    if (tier === 2) {
      // refuse moves that shut it into a pocket smaller than its own body
      var safe = [];
      for (var j = 0; j < legal.length; j++) {
        var dd = legal[j], mx = head.x + dd.x, my = head.y + dd.y;
        var grows = (mx === apple.x && my === apple.y);
        var after = bodyAfterMove(mx, my, grows);
        var room = reachable(mx, my, after.slice(1));
        if (room >= after.length) safe.push({ d: dd, room: room });
      }
      if (safe.length) {
        // prefer the shortest-path move when it is also safe
        for (var s = 0; s < safe.length; s++) {
          if (best && safe[s].d.x === best.x && safe[s].d.y === best.y) return best;
        }
        safe.sort(function (a, b) { return b.room - a.room; });
        return safe[0].d;
      }
      // nothing safe — take whichever move leaves the most room
      var fallback = legal.map(function (dd) {
        var mx = head.x + dd.x, my = head.y + dd.y;
        var after = bodyAfterMove(mx, my, false);
        return { d: dd, room: reachable(mx, my, after.slice(1)) };
      }).sort(function (a, b) { return b.room - a.room; });
      return fallback[0].d;
    }

    return best || legal[0];
  }

  // ------------------------------------------------------------- game state
  function reset() {
    snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0; alive = true; acc = 0; eaten = 0;
    stepTime = mode === "play" ? 0.14 : 0.19;   // the computer moves a touch slower so you can read it
    apple = null;
    if (mode === "play") placeApple();
    syncLabels();
    el.score.textContent = "0";
    el.best.textContent = A.best(bestKey());
    el.skill.textContent = "1";
  }

  function bestKey() { return mode === "play" ? "snake" : "snake-flip"; }

  function syncLabels() {
    var flip = mode === "flip";
    el.modeTag.textContent = flip ? "· you place the apples" : "";
    el.scoreLabel.textContent = flip ? "Apples placed" : "Score";
    el.bestLabel.textContent = flip ? "Best (fewest)" : "Best";
    el.skillWrap.hidden = !flip;
    el.touch.style.display = flip ? "none" : "";
    el.hint.textContent = flip
      ? "Click an empty square to drop an apple. The computer must go and get it — trap it in as few apples as you can."
      : "Eat the apples. Don't hit the walls or yourself.";
  }

  function placeApple() {
    var tries = 0;
    do {
      apple = { x: A.rndInt(0, COLS - 1), y: A.rndInt(0, ROWS - 1) };
      tries++;
    } while (tries < 500 && onSnake(apple.x, apple.y, false));
  }

  function readInput() {
    if (k.any("ArrowLeft", "a", "A") && dir.x !== 1) nextDir = { x: -1, y: 0 };
    else if (k.any("ArrowRight", "d", "D") && dir.x !== -1) nextDir = { x: 1, y: 0 };
    else if (k.any("ArrowUp", "w", "W") && dir.y !== 1) nextDir = { x: 0, y: -1 };
    else if (k.any("ArrowDown", "s", "S") && dir.y !== -1) nextDir = { x: 0, y: 1 };
  }

  function step() {
    if (mode === "flip") {
      if (!apple) return;                       // waiting on you to place one
      var choice = aiChooseDir();
      if (!choice) return die();                // boxed in — you win
      nextDir = choice;
    }
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (!inBounds(head.x, head.y)) return die();
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die();
    }

    snake.unshift(head);
    if (apple && head.x === apple.x && head.y === apple.y) {
      eaten++;
      if (mode === "play") {
        score++;
        el.score.textContent = score;
        placeApple();
        stepTime = Math.max(0.065, 0.14 - score * 0.0035);
      } else {
        apple = null;                           // your move again
        el.skill.textContent = skillTier() + 1;
        stepTime = Math.max(0.10, 0.19 - eaten * 0.006);
        // the snake wins if it survives this many — otherwise a good AI run never ends
        if (eaten >= SURVIVE_TO_WIN) return snakeWins();
      }
    } else {
      snake.pop();
    }
  }

  function snakeWins() {
    alive = false;
    ov.show("<h2>The snake outlasted you</h2><p>It ate all <b>" + SURVIVE_TO_WIN +
      "</b> apples without crashing. Trap it earlier — it is at its dumbest for the first few.</p>" +
      '<button class="btn go" data-act="again">Go again</button>' +
      '<button class="btn" data-act="swap">Drive it yourself</button>');
  }

  function die() {
    alive = false;
    if (mode === "play") {
      var b = A.best("snake", score);
      el.best.textContent = b;
      ov.show("<h2>Game over</h2><p>You scored <b>" + score + "</b>" +
        (score >= b && score > 0 ? " — a new best!" : "") + "</p>" +
        '<button class="btn go" data-act="again">Play again</button>' +
        '<button class="btn" data-act="swap">Try the other side</button>');
    } else {
      // fewer apples is better, so track the minimum
      var prev = A.best("snake-flip-raw");
      var cur = score;
      var bestFewest = prev === 0 ? cur : Math.min(prev, cur);
      try { localStorage.setItem("evercharge:snake-flip-raw", String(bestFewest)); } catch (e) {}
      el.best.textContent = bestFewest;
      ov.show("<h2>You trapped it</h2><p>The computer crashed after <b>" + score +
        "</b> apple" + (score === 1 ? "" : "s") + ". It was at skill " + (skillTier() + 1) + " of 3.</p>" +
        '<button class="btn go" data-act="again">Go again</button>' +
        '<button class="btn" data-act="swap">Drive it yourself</button>');
    }
  }

  // --------------------------------------------------------------- drawing
  function draw() {
    ctx.fillStyle = "#161926";
    ctx.fillRect(0, 0, ctx.W, ctx.H);

    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;
    for (var x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ctx.H); ctx.stroke(); }
    for (var y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(ctx.W, y * CELL); ctx.stroke(); }

    // where your apple would land
    if (mode === "flip" && started && alive && !apple && hover && !onSnake(hover.x, hover.y, false)) {
      ctx.fillStyle = "rgba(255,107,107,.35)";
      A.rrect(ctx, hover.x * CELL + 5, hover.y * CELL + 5, CELL - 10, CELL - 10, 7);
      ctx.fill();
    }

    if (apple) {
      ctx.fillStyle = "#FF6B6B";
      A.rrect(ctx, apple.x * CELL + 5, apple.y * CELL + 5, CELL - 10, CELL - 10, 7);
      ctx.fill();
    }

    for (var i = snake.length - 1; i >= 0; i--) {
      var t = 1 - i / (snake.length + 4);
      ctx.fillStyle = i === 0 ? "#7CF0B4" : "rgba(76,201,138," + (0.35 + t * 0.6).toFixed(3) + ")";
      A.rrect(ctx, snake[i].x * CELL + 2.5, snake[i].y * CELL + 2.5, CELL - 5, CELL - 5, 7);
      ctx.fill();
    }

    if (mode === "flip" && started && alive && !apple) {
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.font = "600 15px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("click a square to place the next apple", ctx.W / 2, ctx.H - 16);
    }
  }

  // ----------------------------------------------------------------- input
  canvas.addEventListener("mousemove", function (e) {
    var r = canvas.getBoundingClientRect();
    hover = {
      x: Math.floor((e.clientX - r.left) / r.width * COLS),
      y: Math.floor((e.clientY - r.top) / r.height * ROWS)
    };
  });
  canvas.addEventListener("mouseleave", function () { hover = null; });
  canvas.addEventListener("click", function (e) {
    if (mode !== "flip" || !started || !alive || apple) return;
    var r = canvas.getBoundingClientRect();
    var cx = Math.floor((e.clientX - r.left) / r.width * COLS);
    var cy = Math.floor((e.clientY - r.top) / r.height * ROWS);
    if (!inBounds(cx, cy) || onSnake(cx, cy, false)) return;
    apple = { x: cx, y: cy };
    score++;
    el.score.textContent = score;
  });

  function menu() {
    started = false;
    ov.show("<h2>Snake</h2><p>Pick a side.</p>" +
      '<button class="btn go" data-act="start-play">You steer</button>' +
      '<button class="btn" data-act="start-flip">You place the apples</button>' +
      '<div class="keys"><b>You steer:</b> arrows or WASD, eat apples, avoid yourself.<br>' +
      '<b>You place the apples:</b> the computer drives. Drop apples in awkward spots and try to box it in — ' +
      'it gets smarter every few apples it eats.</div>');
  }

  ov.onClick("[data-act]", function (b) {
    var act = b.getAttribute("data-act");
    if (act === "start-play") mode = "play";
    if (act === "start-flip") mode = "flip";
    if (act === "swap") { mode = mode === "play" ? "flip" : "play"; }
    reset();
    started = true;
    ov.hide();
  });

  syncLabels();
  reset();
  menu();

  A.loop(function (dt) {
    if (started && alive) {
      if (mode === "play") readInput();
      acc += dt;
      while (acc >= stepTime) { acc -= stepTime; if (alive) step(); }
    }
    draw();
  });
})();
</script>
</body>
</html>
