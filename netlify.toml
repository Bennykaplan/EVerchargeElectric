# Static site — no build step, the repo root is what gets served.
[build]
  publish = "."
  command = ""

# Long cache for the shared assets, but always revalidate the pages so a push
# shows up immediately rather than serving a stale game.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
